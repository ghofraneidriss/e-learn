server:
  port: 9000

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: cours-openapi
          uri: lb://COURS
          predicates:
            - Path=/cours/v3/api-docs,/cours/v3/api-docs/**
        - id: evaluation-openapi
          uri: lb://EVALUATION
          predicates:
            - Path=/evaluation/v3/api-docs,/evaluation/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: cours-service
          uri: lb://COURS
          predicates:
            - Path=/cours/**
        - id: evaluation-service
          uri: lb://EVALUATION
          predicates:
            - Path=/quizzes/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:4200
              - http://localhost:8080
              - http://localhost:9000
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - '*'
            allowCredentials: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/realms/elearn-realm/protocol/openid-connect/certs
springdoc:
  api-docs:
    path: /gateway-api-docs
  swagger-ui:
    urls:
      - name: Cours service
        url: /cours/v3/api-docs
      - name: Evaluation service
        url: /evaluation/v3/api-docs
    urls-primary-name: Cours service
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
