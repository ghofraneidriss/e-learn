server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: cours-service
          uri: lb://Cours
          predicates:
            - Path=/cours/**
        - id: evaluation-service
          uri: lb://evaluation
          predicates:
            - Path=/quizzes/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/elearn-realm
          jwk-set-uri: http://localhost:8081/realms/elearn-realm/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
