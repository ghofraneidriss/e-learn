global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:9000

  - job_name: evaluation
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - evaluation:8082

  - job_name: config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - config-server:8888

  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - eureka-server:8761

  - job_name: cours
    metrics_path: /cours/metrics
    static_configs:
      - targets:
          - cours:8080
