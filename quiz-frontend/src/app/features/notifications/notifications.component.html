<div class="container mt-4" style="max-width: 750px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Notifications</h2>
    <button class="btn btn-sm btn-outline-secondary"
      *ngIf="notifications.length > 0"
      (click)="marquerTousLus()">
      Tout marquer comme lu
    </button>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="notifications.length === 0 && !error" class="text-center text-muted py-5">
    <i class="bi bi-bell-slash fs-1"></i>
    <p class="mt-2">Aucune notification</p>
  </div>

  <div class="list-group">
    <div *ngFor="let n of notifications"
      class="list-group-item list-group-item-action d-flex justify-content-between align-items-start py-3"
      [class.fw-bold]="!n.lu"
      [class.bg-light]="!n.lu"
      (click)="marquerLu(n)"
      style="cursor: pointer;">

      <div class="d-flex gap-3 align-items-start">
        <span class="mt-1">
          <i class="bi bi-bell-fill text-primary" *ngIf="!n.lu"></i>
          <i class="bi bi-bell text-muted" *ngIf="n.lu"></i>
        </span>
        <div>
          <p class="mb-1">{{ n.message }}</p>
          <small class="text-muted">
            <span class="badge bg-secondary me-2">{{ n.type }}</span>
            {{ n.createdAt | date:'dd/MM/yyyy HH:mm' }}
          </small>
        </div>
      </div>

      <button class="btn btn-sm btn-link text-danger ms-2"
        (click)="$event.stopPropagation(); supprimer(n.id)">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>
</div>
