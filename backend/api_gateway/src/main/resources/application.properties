spring.application.name=api_gateway
server.port=8085
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.backup-register-with-eureka=true
eureka.client.fetch-registry=true
#conf route via eureka
spring.cloud.gateway.routes[0].id=Cours
spring.cloud.gateway.routes[0].uri=lb://cours
spring.cloud.gateway.routes[0].predicates[0]=Path=/cours/**

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG