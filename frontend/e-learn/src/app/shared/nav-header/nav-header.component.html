<!--**********************************
    Header start
***********************************-->
<div class="header">
  <div class="header-content">
    <nav class="navbar navbar-expand">
      <div class="collapse navbar-collapse justify-content-between">
        <div class="header-left d-flex align-items-center">
          <!-- Nav Control et Logo -->
          <div class="nav-control">
            <div class="hamburger">
              <span class="line"></span>
              <span class="line"></span>
              <span class="line"></span>
            </div>
          </div>
          <div class="brand-logo me-4">
            <img src="assets/images/logo-elearn.png" alt="E-Learn" style="max-height: 50px;">
          </div>
          
          <!-- Barre de recherche standard EduMin avec espacement -->
          <div class="dashboard_bar ms-3">
            <div class="search_bar dropdown">
              <span class="search_icon p-3 c-pointer" data-bs-toggle="dropdown">
                <i class="mdi mdi-magnify"></i>
              </span>
              <div class="dropdown-menu p-0 m-0">
                <form>
                  <input class="form-control" type="search" placeholder="Search Here" aria-label="Search">
                </form>
              </div>
            </div>
          </div>
        </div>

        <ul class="navbar-nav header-right">
          <!-- Notifications -->
          <li class="nav-item dropdown notification_dropdown">
            <a class="nav-link" href="javascript:void(0);" role="button" data-bs-toggle="dropdown">
              <i class="mdi mdi-bell"></i>
              <div class="pulse-css"></div>
            </a>
            <div class="dropdown-menu dropdown-menu-right">
              <ul class="list-unstyled">
                <li class="media dropdown-item">
                  <span class="success"><i class="ti-user"></i></span>
                  <div class="media-body">
                    <a href="javascript:void(0);">
                      <p><strong>Martin</strong> has added a <strong>customer</strong> Successfully</p>
                    </a>
                  </div>
                  <span class="notify-time">3:20 am</span>
                </li>
                <li class="media dropdown-item">
                  <span class="primary"><i class="ti-shopping-cart"></i></span>
                  <div class="media-body">
                    <a href="javascript:void(0);">
                      <p><strong>Jennifer</strong> purchased Light Dashboard 2.0.</p>
                    </a>
                  </div>
                  <span class="notify-time">3:20 am</span>
                </li>
                <li class="media dropdown-item">
                  <span class="danger"><i class="ti-bookmark"></i></span>
                  <div class="media-body">
                    <a href="javascript:void(0);">
                      <p><strong>Robin</strong> marked a <strong>ticket</strong> as unsolved.</p>
                    </a>
                  </div>
                  <span class="notify-time">3:20 am</span>
                </li>
              </ul>
              <a class="all-notification" href="javascript:void(0);">See all notifications <i class="ti-arrow-right"></i></a>
            </div>
          </li>

          <!-- Profil Utilisateur Complet -->
          <li class="nav-item dropdown header-profile">
            <a class="nav-link" href="javascript:void(0);" role="button" (click)="toggleProfileMenu()">
              <img src="./images/profile/pic1.jpg" width="20" alt="Profile">
              <div class="header-info">
                <span class="text-black"><strong>{{ getUserName() }}</strong></span>
                <p class="fs-12 mb-0">{{ getUserRole() }}</p>
              </div>
            </a>
            <div class="dropdown-menu dropdown-menu-right" [class.show]="showProfileMenu">
              <a routerLink="/profile" (click)="closeProfileMenu()" class="dropdown-item ai-icon" style="cursor: pointer;">
                <svg id="icon-user1" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-user">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span class="ms-2">Mon Profil</span>
              </a>
              <a href="javascript:void(0);" class="dropdown-item ai-icon">
                <svg id="icon-inbox" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-mail">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <span class="ms-2">Inbox</span>
              </a>
              <a (click)="logout()" class="dropdown-item ai-icon" style="cursor: pointer;">
                <svg id="icon-logout" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-log-out">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span class="ms-2">Déconnexion</span>
              </a>
            </div>
          </li>
        </ul>
      </div>
    </nav>
  </div>
</div>
<!--**********************************
    Header end
***********************************-->
