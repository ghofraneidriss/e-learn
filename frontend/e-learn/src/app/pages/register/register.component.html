<div class="auth-container">
  <div class="auth-card">
    <h1 class="brand-name">E-Learn</h1>
    <p class="brand-sub">Créer votre compte</p>

    <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="success-msg">{{ successMessage }}</div>

    <div class="form-group">
      <label>Nom complet</label>
      <input 
        type="text" 
        [(ngModel)]="formData.name" 
        name="name"
        placeholder="Votre nom complet"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input 
        type="email" 
        [(ngModel)]="formData.email" 
        name="email"
        placeholder="votre@email.com"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label>Mot de passe</label>
      <input 
        type="password" 
        [(ngModel)]="formData.password" 
        name="password"
        placeholder="Minimum 6 caractères"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label>Confirmer mot de passe</label>
      <input 
        type="password" 
        [(ngModel)]="formData.confirmPassword" 
        name="confirmPassword"
        placeholder="Répéter le mot de passe"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label>Rôle</label>
      <select [(ngModel)]="formData.role" name="role" class="form-control">
        <option value="ADMIN">Administrateur</option>
        <option value="PROF">Professeur</option>
        <option value="ETUDIANT">Étudiant</option>
      </select>
    </div>

    <button (click)="onSubmit()" class="btn-register">Créer mon compte</button>

    <p class="login-link">
      Déjà un compte ? <a routerLink="/login">Se connecter</a>
    </p>
  </div>
</div>
