<section class="page-header page-header--bg-two" data-jarallax="" data-speed="0.3" data-imgposition="50% -100%" *ngIf="!loading && !errorMsg">
    <div class="page-header__bg jarallax-img"></div>
    <div class="page-header__overlay"></div>
    <div class="container text-center">
        <h2 class="page-header__title">Courses</h2>
        <ul class="page-header__breadcrumb list-unstyled">
            <li><a routerLink="/">Home</a></li>
            <li><span>Courses</span></li>
        </ul>
    </div>
</section>

<section class="course-two course-two--page" *ngIf="!loading && !errorMsg">
    <div class="course-two__shape-top wow fadeInRight" data-wow-delay="300ms">
        <img src="/frontoffice/eduact-html/assets/images/shapes/course-shape-1.png" alt="shape">
    </div>
    <div class="container">
        <div class="row">
            <div class="col-xl-4 col-md-6 wow fadeInUp" *ngFor="let course of courses; let i = index" [attr.data-wow-delay]="(i * 100) + 'ms'">
                <app-course-card [course]="course"></app-course-card>
            </div>
        </div>

        <div *ngIf="courses.length === 0" class="no-courses text-center mt-5">
            <h3>No courses available at the moment.</h3>
        </div>
    </div>
    <div class="course-two__shape-bottom wow fadeInLeft" data-wow-delay="400ms">
        <img src="/frontoffice/eduact-html/assets/images/shapes/course-shape-2.png" alt="shape">
    </div>
</section>

<!-- Loading State -->
<div class="preloader" *ngIf="loading">
    <div class="preloader__image" style="background-image: url(/frontoffice/eduact-html/assets/images/loader.png);"></div>
</div>

<!-- Error State -->
<div class="container mt-5 pt-5" *ngIf="errorMsg">
    <div class="alert alert-danger text-center">
        {{ errorMsg }}
    </div>
</div>
